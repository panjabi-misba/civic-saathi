<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Civic Saathi — Your Voice. AI-Powered. Your City, Better. Report civic issues in your own words, track them live, explore community city signals and ask our AI assistant anything."
    />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="Civic Saathi — Civic Intelligence & Action" />
    <meta
      property="og:description"
      content="Report civic issues with AI understanding, track resolution transparently and explore community city signals."
    />
    <meta property="og:type" content="website" />
    <title>Civic Saathi — Civic Intelligence & Action</title>

    <script>
      (function () {
        try {
          var raw = localStorage.getItem('civic-sathi:theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = raw ? raw === '"dark"' : prefersDark
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
